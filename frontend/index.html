<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Predicción de resultados de fútbol</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 12px; font-size: 0.9rem; color: #555; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 12px; padding: 10px 16px; background: #2E86AB; color: white; border: none; border-radius: 6px; cursor: pointer; }
  button:hover { background: #256d8a; }
  .liga-opcion { padding: 8px; border: 1px solid #ddd; border-radius: 6px; margin-top: 6px; cursor: pointer; }
  .liga-opcion:hover { background: #f5f5f5; }
  .liga-elegida { background: #eaf4fa; border-color: #2E86AB; }
  .dia-header { margin-top: 18px; font-weight: 600; color: #444; border-bottom: 1px solid #eee; padding-bottom: 4px; }
  .fixture { padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-top: 8px; cursor: pointer; }
  .fixture:hover { background: #f5f5f5; }
  #resultado { margin-top: 24px; }
  canvas { max-height: 280px; }
  .aviso { color: #a00; font-size: 0.9rem; }
  .muted { color: #888; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>⚽ Predicción de resultados</h1>

  <label>Buscar liga (por nombre o por país — cualquier liga del mundo)</label>
  <input type="text" id="buscar" placeholder="ej: Premier League, Argentina, Serie A..." />
  <button onclick="buscarLigas()">Buscar</button>

  <div id="ligas"></div>
  <div id="fixtures"></div>
  <div id="resultado"></div>

  <script>
    let ligaSeleccionada = null;
    let chart = null;

    async function buscarLigas() {
      const q = document.getElementById('buscar').value.trim();
      const cont = document.getElementById('ligas');
      document.getElementById('fixtures').innerHTML = '';
      document.getElementById('resultado').innerHTML = '';
      if (!q) return;
      cont.innerHTML = 'Buscando...';

      async function intentarBusqueda(url) {
        const resp = await fetch(url);
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.detail || `Error ${resp.status}`);
        }
        return resp.json();
      }

      let ligas;
      try {
        ligas = await intentarBusqueda(`/api/ligas?pais=${encodeURIComponent(q)}`);
        if (!ligas.length) {
          ligas = await intentarBusqueda(`/api/ligas?nombre=${encodeURIComponent(q)}`);
        }
      } catch (e) {
        cont.innerHTML = `<p class="aviso">Error al buscar: ${e.message}</p>`;
        return;
      }

      if (!ligas.length) {
        cont.innerHTML = '<p class="aviso">No encontré ligas con ese nombre/país.</p>';
        return;
      }

      cont.innerHTML = '';
      ligas.forEach(l => {
        const div = document.createElement('div');
        div.className = 'liga-opcion';
        div.textContent = `${l.nombre} — ${l.pais}${l.temporada_actual ? ' (temporada ' + l.temporada_actual + ')' : ' (sin temporada activa)'}`;
        div.onclick = () => {
          if (!l.temporada_actual) {
            alert('Esta liga no tiene una temporada activa ahora mismo.');
            return;
          }
          ligaSeleccionada = l;
          document.querySelectorAll('.liga-opcion').forEach(e => e.classList.remove('liga-elegida'));
          div.classList.add('liga-elegida');
          cargarFixtures();
        };
        cont.appendChild(div);
      });
    }

    async function cargarFixtures() {
      const cont = document.getElementById('fixtures');
      document.getElementById('resultado').innerHTML = '';
      if (!ligaSeleccionada) return;
      cont.innerHTML = 'Buscando partidos de los próximos 7 días...';

      const resp = await fetch(`/api/fixtures?league_id=${ligaSeleccionada.league_id}&season=${ligaSeleccionada.temporada_actual}&dias=7`);
      const fixtures = await resp.json();

      if (!fixtures.length) {
        cont.innerHTML = '<p>No hay partidos programados en los próximos 7 días para esta liga.</p>';
        return;
      }

      cont.innerHTML = '';
      let diaActual = null;
      fixtures.forEach(f => {
        const dia = f.fecha.slice(0, 10);
        if (dia !== diaActual) {
          diaActual = dia;
          const header = document.createElement('div');
          header.className = 'dia-header';
          header.textContent = dia;
          cont.appendChild(header);
        }
        const div = document.createElement('div');
        div.className = 'fixture';
        div.textContent = `${f.local_nombre} vs ${f.visita_nombre}`;
        div.onclick = () => verPrediccion(f.local_id, f.visita_id);
        cont.appendChild(div);
      });
    }

    async function verPrediccion(localId, visitaId) {
      const div = document.getElementById('resultado');
      div.innerHTML = 'Calculando predicción...';
      const resp = await fetch(`/api/prediccion?league_id=${ligaSeleccionada.league_id}&season=${ligaSeleccionada.temporada_actual}&local_id=${localId}&visita_id=${visitaId}`);
      const r = await resp.json();
      div.innerHTML = `
        <h2>${r.equipo_local} vs ${r.equipo_visita}</h2>
        <p>Goles esperados: ${r.goles_esperados_local} - ${r.goles_esperados_visita}</p>
        <canvas id="chart"></canvas>
      `;
      const ctx = document.getElementById('chart').getContext('2d');
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: [`Gana ${r.equipo_local}`, 'Empate', `Gana ${r.equipo_visita}`],
          datasets: [{
            data: [r.prob_gana_local, r.prob_empate, r.prob_gana_visita],
            backgroundColor: ['#2E86AB', '#A9A9A9', '#D64550'],
          }],
        },
        options: {
          scales: { y: { beginAtZero: true, max: 100 } },
          plugins: { legend: { display: false } },
        },
      });
    }
  </script>
</body>
</html>
